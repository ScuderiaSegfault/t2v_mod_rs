[package]
name = "t2v_driver"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Felix Resch <felix.resch@tuwien.ac.at>"]

[dependencies]
t2v_module = { path = "../t2v_module" }
async-std = { version = "1.13.2", features = ["attributes"] }
log = "0.4.28"
pretty_env_logger = "0.5.0"
tokio = { version = "1.47.1", features = ["io-util"] }
clap = { version = "4.5.48", features = ["cargo", "color", "env", "derive"] }
sd-notify = { version = "0.4.5", optional = true }
systemd-journal-logger = { version = "2.2.2", optional = true }
serde_json = "1.0.145"
t2v_driver_proto = { path = "../t2v_driver_proto" }
futures = "0.3.31"

[features]
systemd = ["sd-notify", "systemd-journal-logger"]